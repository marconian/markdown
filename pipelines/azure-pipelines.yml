name: $(Build.DefinitionName)_$(Year:yy).$(Month).$(DayOfMonth)$(Rev:.r)

trigger:
  - main
  - dev

resources:
  repositories:
    - repository: SharedPipelines
      type: git
      name: Shared.Pipelines/Shared.Pipelines
      ref: refs/heads/main

variables:
  PNPM_STORE_PATH: $(Pipeline.Workspace)/.pnpm-store
  PACKAGE_DIRECTORY: '.'

parameters:
  - name: nodeVersion
    displayName: 'Node.js Version'
    type: string
    default: '20.x'
  - name: runTests
    displayName: 'Run Unit Tests'
    type: boolean
    default: true
  - name: artifactName
    displayName: 'Build Artifact Name'
    type: string
    default: 'MarkdownPackageArtifact'
  - name: publishAlpha
    displayName: 'Publish alpha (manual run)'
    type: boolean
    default: false

stages:
  - stage: Build
    displayName: 'Build Package'
    dependsOn: []
    jobs:
      - template: jobs/build-node-package-job.yml@SharedPipelines
        parameters:
          packageDirectory: $(PACKAGE_DIRECTORY)
          artifactName: ${{ parameters.artifactName }}
          nodeVersion: ${{ parameters.nodeVersion }}

  - stage: Test
    displayName: 'Run Tests'
    dependsOn: []
    condition: ${{ parameters.runTests }}
    jobs:
      - template: jobs/run-node-tests-job.yml@SharedPipelines
        parameters:
          packageDirectory: $(PACKAGE_DIRECTORY)
          nodeVersion: ${{ parameters.nodeVersion }}

  - stage: PublishAlpha
    displayName: 'Publish Alpha Package'
    dependsOn:
      - Build
      - Test
    condition: |
      and(
        succeeded('Build'),
        or(not(${{ parameters.runTests }}), succeeded('Test')),
        ne(variables['Build.Reason'], 'PullRequest'),
        or(
          eq(variables['Build.SourceBranch'], 'refs/heads/dev'),
          and(eq(variables['Build.Reason'], 'Manual'), eq('${{ parameters.publishAlpha }}', 'true'))
        )
      )
    jobs:
      - template: jobs/deploy-node-package-job.yml@SharedPipelines
        parameters:
          artifactName: ${{ parameters.artifactName }}
          nodeVersion: ${{ parameters.nodeVersion }}
          npmTag: 'alpha'

  - stage: PublishStable
    displayName: 'Publish Stable Package'
    dependsOn:
      - Build
      - Test
    condition: |
      and(
        succeeded('Build'),
        or(not(${{ parameters.runTests }}), succeeded('Test')),
        ne(variables['Build.Reason'], 'PullRequest'),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    jobs:
      - template: jobs/deploy-node-package-job.yml@SharedPipelines
        parameters:
          artifactName: ${{ parameters.artifactName }}
          nodeVersion: ${{ parameters.nodeVersion }}
          environment: 'Production'
          npmTag: 'stable'
